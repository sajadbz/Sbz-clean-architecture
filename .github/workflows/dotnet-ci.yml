name: .NET CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Sbz.sln

      - name: Build in Release mode
        run: dotnet build Sbz.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Sbz.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Test the owner-picker JavaScript
        id: owner-picker
        if: success() || failure()
        run: node --test tests/owner-picker.test.cjs

      - name: Verify the Functional Design report
        id: design-report
        if: success() || failure()
        shell: pwsh
        run: ./scripts/Test-TestSummary.ps1

      - name: Publish the Functional Design and test summary
        if: always()
        shell: pwsh
        env:
          OWNER_PICKER_OUTCOME: ${{ steps.owner-picker.outcome }}
          DESIGN_REPORT_OUTCOME: ${{ steps.design-report.outcome }}
        run: >-
          ./scripts/Write-TestSummary.ps1 -ResultsDirectory artifacts/test-results
          -OwnerPickerOutcome $env:OWNER_PICKER_OUTCOME
          -ReportingOutcome $env:DESIGN_REPORT_OUTCOME -RequireCoverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
